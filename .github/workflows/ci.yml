name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run quality checks
        run: bash scripts/run_quality.sh

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest

    container:
      image: marketsquare/robotframework-browser:20.6.0
      options: --ipc=host --user pwuser

    env:
      ENV: qa
      HEADLESS: "true"
      API_USERNAME: ${{ secrets.BOOKER_USERNAME || 'admin' }}
      API_PASSWORD: ${{ secrets.BOOKER_PASSWORD || 'password123' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install project dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run smoke suite
        run: bash scripts/run_tests.sh smoke qa

      - name: Upload Robot Framework results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-smoke-results
          path: results/
          retention-days: 7
