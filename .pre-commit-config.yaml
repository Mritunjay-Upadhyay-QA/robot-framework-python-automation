repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Python lint
        entry: ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff Python formatter
        entry: ruff format
        language: system
        types: [python]

      - id: robocop-check
        name: Robocop Robot Framework lint
        entry: robocop check --threshold E .
        language: system
        pass_filenames: false
        files: \.(robot|resource)$
